---
- name: Bootstrap dotfiles and development environment
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/packages.yml

  roles:
    - role: system
      tags: [system]

    - role: dotfiles
      tags: [dotfiles]

    - role: to_root
      tags: [dotfiles, to_root]

    - role: shell
      tags: [shell]

    - role: languages
      tags: [languages]

    - role: herdr
      tags: [herdr]

    - role: opencode
      tags: [opencode]

    - role: claude-code
      tags: [claude-code]

    - role: pi
      tags: [pi]

    - role: neovim
      tags: [neovim]

    - role: gnome
      tags: [gnome]
      when: ansible_facts.env.XDG_CURRENT_DESKTOP is defined and 'GNOME' in ansible_facts.env.XDG_CURRENT_DESKTOP
