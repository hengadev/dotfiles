---
- name: Check if dotfiles repo is already initialized
  ansible.builtin.stat:
    path: "{{ dotfiles_dest }}/.git"
  register: dotfiles_git_dir

- name: Clone dotfiles into ~/.config (fresh machine)
  # Uses init+fetch approach to clone into a pre-existing non-empty directory
  ansible.builtin.shell: |
    set -e
    git init "{{ dotfiles_dest }}"
    cd "{{ dotfiles_dest }}"
    git remote add origin "{{ dotfiles_repo }}"
    git fetch --depth=1 origin "{{ dotfiles_branch }}"
    git checkout -f "{{ dotfiles_branch }}"
    git branch --set-upstream-to=origin/"{{ dotfiles_branch }}" "{{ dotfiles_branch }}"
  args:
    executable: /bin/bash
  when: not dotfiles_git_dir.stat.exists
  changed_when: true

- name: Fetch latest dotfiles from origin
  ansible.builtin.shell: |
    set -e
    git fetch origin "{{ dotfiles_branch }}"
  args:
    executable: /bin/bash
    chdir: "{{ dotfiles_dest }}"
  when: dotfiles_git_dir.stat.exists and not ansible_check_mode
  changed_when: false

- name: Fast-forward dotfiles repository to origin
  # ansible.builtin.git's branch checkout always does a "git reset --hard
  # origin/<branch>" internally, regardless of its own force: parameter -
  # that silently discards local commits/edits that aren't on origin yet.
  # A plain fast-forward merge can't do that: it just refuses (non-zero
  # rc, caught by failed_when below) if the local branch has diverged,
  # leaving the working tree completely untouched.
  ansible.builtin.command:
    cmd: git merge --ff-only "origin/{{ dotfiles_branch }}"
    chdir: "{{ dotfiles_dest }}"
  register: dotfiles_ff
  when: dotfiles_git_dir.stat.exists and not ansible_check_mode
  changed_when: "'Already up to date' not in dotfiles_ff.stdout"
  failed_when: false

- name: Warn if dotfiles repository has unpushed local changes
  ansible.builtin.debug:
    msg: >-
      Skipped updating {{ dotfiles_dest }} from origin/{{ dotfiles_branch }}:
      local branch has commits or changes not on origin. Push or stash them,
      then re-run bootstrap to pick up the latest dotfiles.
  when:
    - dotfiles_git_dir.stat.exists
    - not ansible_check_mode
    - dotfiles_ff.rc is defined
    - dotfiles_ff.rc != 0

- name: Initialize git submodules (zsh plugins, etc.)
  ansible.builtin.shell: |
    cd "{{ dotfiles_dest }}" && git submodule update --init --recursive
  args:
    executable: /bin/bash
  changed_when: false
