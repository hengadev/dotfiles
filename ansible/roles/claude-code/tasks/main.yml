---
- name: Check if claude code is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.local/bin/claude"
  register: claude_bin

- name: Install claude code
  ansible.builtin.shell: |
    curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
  when: not claude_bin.stat.exists
  changed_when: not claude_bin.stat.exists

- name: Update claude code to the latest version
  ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/claude update"
  register: claude_update_result
  changed_when: "'up to date' not in claude_update_result.stdout"

- name: Ensure ~/.claude directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.claude"
    state: directory
    mode: "0755"

- name: Ensure claude code commands directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.claude/commands"
    state: directory

- name: Find custom claude code commands
  ansible.builtin.find:
    paths: "{{ dotfiles_dest }}/claude-code/commands"
    file_type: file
    depth: 1
  register: claude_commands

- name: Symlink custom claude code commands
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts.env.HOME }}/.claude/commands/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ claude_commands.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Set claude-code config paths
  ansible.builtin.set_fact:
    claude_statusline_path: "{{ ansible_facts.env.HOME }}/.claude/statusline-command.sh"
    claude_settings_path: "{{ ansible_facts.env.HOME }}/.claude/settings.json"

- name: Deploy status line script
  ansible.builtin.copy:
    src: statusline-command.sh
    dest: "{{ claude_statusline_path }}"
    mode: "0755"

- name: Check if Claude settings.json exists
  ansible.builtin.stat:
    path: "{{ claude_settings_path }}"
  register: claude_settings_stat

- name: Read existing Claude settings.json
  ansible.builtin.slurp:
    src: "{{ claude_settings_path }}"
  register: claude_settings_raw
  when: claude_settings_stat.stat.exists

- name: Merge status line config into Claude settings.json
  vars:
    existing_settings: "{{ (claude_settings_raw.content | b64decode | from_json) if claude_settings_stat.stat.exists else {} }}"
    merged_settings: "{{ existing_settings | combine({'statusLine': {'type': 'command', 'command': 'bash ' + claude_statusline_path}}, recursive=True) }}"
  ansible.builtin.copy:
    content: "{{ merged_settings | to_nice_json(indent=2) }}\n"
    dest: "{{ claude_settings_path }}"
    mode: "0644"
