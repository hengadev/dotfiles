---
- name: Update apt cache (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Update dnf cache (Fedora/RHEL)
  ansible.builtin.dnf:
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Install system packages
  ansible.builtin.package:
    name: "{{ system_packages_common + (system_packages_debian if ansible_facts['os_family'] == 'Debian' else system_packages_redhat) }}"
    state: present
  become: true

- name: Install wezterm
  block:
    - name: Check if wezterm is installed
      ansible.builtin.stat:
        path: /usr/bin/wezterm
      register: wezterm_bin

    - name: Enable wezterm COPR repo (Fedora/RHEL)
      ansible.builtin.command:
        cmd: dnf copr enable -y wezfurlong/wezterm-nightly
      become: true
      when:
        - ansible_facts['os_family'] == "RedHat"
        - not wezterm_bin.stat.exists
      changed_when: true

    - name: Install wezterm (Fedora/RHEL)
      ansible.builtin.dnf:
        name: wezterm
        state: present
      become: true
      when:
        - ansible_facts['os_family'] == "RedHat"
        - not wezterm_bin.stat.exists

    - name: Add wezterm apt signing key (Debian/Ubuntu)
      ansible.builtin.get_url:
        url: https://apt.fury.io/wez/gpg.key
        dest: /usr/share/keyrings/wezterm-fury.gpg.key
      become: true
      when:
        - ansible_facts['os_family'] == "Debian"
        - not wezterm_bin.stat.exists

    - name: Dearmor wezterm apt signing key (Debian/Ubuntu)
      ansible.builtin.shell: |
        set -e
        gpg --yes --dearmor -o /usr/share/keyrings/wezterm-fury.gpg /usr/share/keyrings/wezterm-fury.gpg.key
      args:
        executable: /bin/bash
      become: true
      when:
        - ansible_facts['os_family'] == "Debian"
        - not wezterm_bin.stat.exists
      changed_when: true

    - name: Add wezterm apt repo (Debian/Ubuntu)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *"
        filename: wezterm
        state: present
      become: true
      when:
        - ansible_facts['os_family'] == "Debian"
        - not wezterm_bin.stat.exists

    - name: Install wezterm (Debian/Ubuntu)
      ansible.builtin.apt:
        name: wezterm
        state: present
        update_cache: true
      become: true
      when:
        - ansible_facts['os_family'] == "Debian"
        - not wezterm_bin.stat.exists

- name: Install Brave browser
  block:
    - name: Check if Brave is installed
      ansible.builtin.stat:
        path: /usr/bin/brave-browser
      register: brave_bin

    - name: Download and install Brave browser
      ansible.builtin.shell: |
        set -e
        curl -fsS https://dl.brave.com/install.sh | sh
      args:
        executable: /bin/bash
      become: true
      when: not brave_bin.stat.exists
      changed_when: not brave_bin.stat.exists

- name: Install Discord
  block:
    - name: Check if Discord is installed
      ansible.builtin.stat:
        path: /usr/bin/discord
      register: discord_bin

    - name: Download Discord
      ansible.builtin.get_url:
        url: "https://discord.com/api/download?platform=linux&format=tar.gz"
        dest: /tmp/discord.tar.gz
      when: not discord_bin.stat.exists

    - name: Extract Discord to /opt
      ansible.builtin.unarchive:
        src: /tmp/discord.tar.gz
        dest: /opt
        remote_src: true
      become: true
      when: not discord_bin.stat.exists

    - name: Symlink discord binary into PATH
      ansible.builtin.file:
        src: /opt/Discord/discord
        dest: /usr/bin/discord
        state: link
      become: true
      when: not discord_bin.stat.exists

    - name: Install Discord desktop entry
      ansible.builtin.copy:
        src: /opt/Discord/discord.desktop
        dest: /usr/share/applications/discord.desktop
        remote_src: true
      become: true
      when: not discord_bin.stat.exists

    - name: Install Discord icon
      ansible.builtin.copy:
        src: /opt/Discord/discord.png
        dest: /usr/share/pixmaps/discord.png
        remote_src: true
      become: true
      when: not discord_bin.stat.exists

- name: Install Anki
  block:
    - name: Check if Anki is installed
      ansible.builtin.stat:
        path: /usr/local/bin/anki
      register: anki_bin

    - name: Get latest Anki release info
      ansible.builtin.uri:
        url: https://api.github.com/repos/ankitects/anki/releases/latest
        return_content: true
      register: anki_release
      check_mode: false
      when: not anki_bin.stat.exists

    - name: Download Anki
      ansible.builtin.get_url:
        url: "{{ anki_release.json.assets | selectattr('name', 'match', '.*linux-x86_64\\.tar\\.zst$') | map(attribute='browser_download_url') | first }}"
        dest: /tmp/anki.tar.zst
      when: not anki_bin.stat.exists

    - name: Extract and install Anki
      # install.sh's xdg-mime calls can fail on systems without a writable
      # /usr/share/mime (harmless - the binary/desktop/icon are already
      # copied by that point), so don't let that abort the whole task.
      ansible.builtin.shell: |
        set -e
        tar --zstd -xf /tmp/anki.tar.zst -C /tmp
        cd /tmp/anki-linux
        ./install.sh || true
      args:
        executable: /bin/bash
      become: true
      when: not anki_bin.stat.exists
      changed_when: not anki_bin.stat.exists

- name: Install lazygit
  block:
    - name: Get latest lazygit version
      ansible.builtin.uri:
        url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
        return_content: true
      register: lazygit_release
      check_mode: false

    - name: Set lazygit version fact
      ansible.builtin.set_fact:
        lazygit_version: "{{ lazygit_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Download lazygit
      ansible.builtin.unarchive:
        src: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_Linux_x86_64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include:
          - lazygit
      become: true

- name: Install lazydocker
  block:
    - name: Get latest lazydocker version
      ansible.builtin.uri:
        url: https://api.github.com/repos/jesseduffield/lazydocker/releases/latest
        return_content: true
      register: lazydocker_release
      check_mode: false

    - name: Set lazydocker version fact
      ansible.builtin.set_fact:
        lazydocker_version: "{{ lazydocker_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Download lazydocker
      ansible.builtin.unarchive:
        src: "https://github.com/jesseduffield/lazydocker/releases/download/v{{ lazydocker_version }}/lazydocker_{{ lazydocker_version }}_Linux_x86_64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include:
          - lazydocker
      become: true
