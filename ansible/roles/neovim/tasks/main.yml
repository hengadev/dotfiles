---
- name: Add neovim PPA (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: ppa:neovim-ppa/unstable
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Update apt cache after adding PPA (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install neovim
  ansible.builtin.package:
    name: neovim
    state: present
  become: true

- name: Install neovim Python provider
  # package installs (system role's python3-pip, or neovim itself above)
  # only get simulated under --check, not actually applied - so pip3 (and
  # a real neovim binary for the Lazy sync below) may not exist for real
  # yet. Skip the rest of this role under check mode rather than fail.
  ansible.builtin.pip:
    name: pynvim
    state: present
    extra_args: --user
  when: not ansible_check_mode

- name: Install neovim Node provider
  ansible.builtin.shell: |
    export NVM_DIR="{{ ansible_facts.env.HOME }}/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
    npm install -g neovim
  args:
    executable: /bin/bash
  changed_when: false

- name: Sync neovim plugins with Lazy
  ansible.builtin.shell: |
    nvim --headless "+Lazy! sync" +qa
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ansible_facts.env.HOME }}"
    XDG_CONFIG_HOME: "{{ ansible_facts.env.HOME }}/.config"
  changed_when: true
  # Lazy sync always runs to pick up any new plugins
