---
# Package names shared across distros (apt and dnf agree on these).
system_packages_common:
  - git
  - curl
  - wget
  - zsh
  - tmux
  - ripgrep
  - fd-find
  - fzf
  - unzip
  - zip
  - xclip
  - xdg-utils
  - ca-certificates
  - python3-pip

# Debian/Ubuntu-only extras (compiler meta-package, PPA/repo tooling).
system_packages_debian:
  - build-essential
  - lsb-release
  - software-properties-common
  - gnupg

# Fedora/RHEL equivalents.
system_packages_redhat:
  - gcc
  - gcc-c++
  - make
  - dnf-plugins-core
  - gnupg2

dev_packages:
  - lazygit
  - lazydocker
