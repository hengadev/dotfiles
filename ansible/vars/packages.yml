---
# Package names shared across distros (apt and dnf agree on these).
system_packages_common:
  - git
  - curl
  - wget
  - zsh
  - tmux
  - ripgrep
  - fd-find
  - fzf
  - unzip
  - zip
  - xclip
  - xdg-utils
  - ca-certificates
  - python3-pip
  - zoxide
  - zstd

# Debian/Ubuntu-only extras (compiler meta-package, PPA/repo tooling).
system_packages_debian:
  - build-essential
  - lsb-release
  - software-properties-common
  - gnupg

# Fedora/RHEL equivalents.
system_packages_redhat:
  - gcc
  - gcc-c++
  - make
  - dnf-plugins-core
  - gnupg2

dev_packages:
  - lazygit
  - lazydocker

# Sway/Wayland desktop stack - package names that agree across apt and dnf.
sway_packages_common:
  - sway
  - waybar
  - wofi
  - i3lock
  - xss-lock
  - wireplumber
  - brightnessctl
  - pavucontrol
  - xdg-desktop-portal
  - xdg-desktop-portal-wlr

# Debian/Ubuntu-only names for the sway stack.
sway_packages_debian:
  - dex
  - network-manager-gnome

# Fedora/RHEL equivalents.
sway_packages_redhat:
  - dex-autostart
  - network-manager-applet
  - nm-connection-editor
